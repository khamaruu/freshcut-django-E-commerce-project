{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Fresh Cut</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root{
  --green:#1b5e20;
  --green2:#2e7d32;
  --bg:#f6f8f7;
}

body{
  background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Segoe UI", system-ui;
}

.login-card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  padding:40px;
  max-width:400px;
  width:100%;
}

.brand{
  text-align:center;
  font-size:26px;
  font-weight:900;
  color:var(--green);
  margin-bottom:10px;
}

.brand span{
  color:#000;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:30px;
}

.form-control{
  border-radius:12px;
  padding:12px 14px;
}

.btn-login{
  background:linear-gradient(135deg,var(--green),var(--green2));
  border:none;
  border-radius:12px;
  padding:12px;
  font-weight:600;
  font-size:16px;
}

.btn-login:hover{
  opacity:.9;
}

.footer-text{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="login-card">
  <div class="brand">Fresh<span>Cut</span> Admin</div>
  <div class="subtitle">Secure Admin Login</div>

  <form>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" class="form-control" placeholder="admin@example.com" required>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-login text-white w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i> Login
    </button>
  </form>

  <div class="footer-text">
    © 2026 Fresh Cut Admin Panel
  </div>
</div>

</body>
</html> {% endcomment %}
