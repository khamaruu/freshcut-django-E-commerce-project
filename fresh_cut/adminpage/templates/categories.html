<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Categories</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body{
      background:#f5f7fa;
      font-family:"Segoe UI", system-ui;
    }
    .sidebar{
      width:260px;
      min-height:100vh;
      background:#1b5e20;
      color:#fff;
    }
    .sidebar a{
      color:#dfeede;
      text-decoration:none;
      display:block;
      padding:12px 20px;
      border-radius:8px;
      margin:6px 10px;
    }
    .sidebar a:hover,.sidebar a.active{
      background:#2e7d32;
      color:#fff;
    }
    .content{
      padding:30px;
    }
    .card{
      border:none;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }
    .btn-green{
      background:#2e7d32;
      color:#fff;
    }
    .btn-green:hover{
      background:#1b5e20;
      color:#fff;
    }
  </style>
</head>
<body>
 {% include 'sidebar.html' %}
  <!-- CONTENT -->
  <div class="flex-grow-1 content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">Category Management</h3>
      <button class="btn btn-green" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        <i class="bi bi-plus-circle me-1"></i> Add Category
      </button>
    </div>

    <!-- CATEGORY TABLE -->
    <div class="card">
      <div class="card-body">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Category Name</th>
              <th>Description</th>
              <th>Status</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Chicken</td>
              <td>Fresh farm chicken products</td>
              <td><span class="badge bg-success">Active</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td>2</td>
              <td>Fish</td>
              <td>Fresh sea & river fish</td>
              <td><span class="badge bg-success">Active</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td>3</td>
              <td>Mutton</td>
              <td>Premium quality mutton</td>
              <td><span class="badge bg-secondary">Inactive</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- ADD CATEGORY MODAL -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Add New Category</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Category Name</label>
              <input type="text" class="form-control" placeholder="Enter category name" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" placeholder="Category description"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-green">Save Category</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
