<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Coupons</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body{
      background:#f5f7fa;
      font-family:"Segoe UI", system-ui;
    }
    .sidebar{
      width:260px;
      min-height:100vh;
      background:#1b5e20;
      color:#fff;
    }
    .sidebar a{
      color:#dfeede;
      text-decoration:none;
      display:block;
      padding:12px 20px;
      border-radius:8px;
      margin:6px 10px;
    }
    .sidebar a:hover,.sidebar a.active{
      background:#2e7d32;
      color:#fff;
    }
    .content{
      padding:30px;
    }
    .card{
      border:none;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }
    .badge-status{
      padding:6px 12px;
      border-radius:20px;
      font-size:13px;
    }
    .btn-green{
      background:#2e7d32;
      color:#fff;
    }
    .btn-green:hover{
      background:#1b5e20;
      color:#fff;
    }
  </style>
</head>
<body>
 {% include 'sidebar.html' %}

  <!-- CONTENT -->
  <div class="flex-grow-1 content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">Coupon Management</h3>
      <button class="btn btn-green" data-bs-toggle="modal" data-bs-target="#addCouponModal">
        <i class="bi bi-plus-circle me-1"></i> Add Coupon
      </button>
    </div>

    <!-- COUPON TABLE -->
    <div class="card">
      <div class="card-body">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Code</th>
              <th>Discount</th>
              <th>Min Order</th>
              <th>Usage</th>
              <th>Expiry</th>
              <th>Status</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>FRESH50</strong></td>
              <td>₹50 OFF</td>
              <td>₹499</td>
              <td>120 / 200</td>
              <td>31 Jan 2026</td>
              <td><span class="badge bg-success badge-status">Active</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
            <tr>
              <td><strong>WELCOME10</strong></td>
              <td>10% OFF</td>
              <td>₹299</td>
              <td>80 / 100</td>
              <td>20 Jan 2026</td>
              <td><span class="badge bg-warning text-dark badge-status">Expired</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- ADD COUPON MODAL -->
<div class="modal fade" id="addCouponModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Add New Coupon</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Coupon Code</label>
              <input type="text" class="form-control" placeholder="e.g. SAVE50" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Discount</label>
              <input type="text" class="form-control" placeholder="e.g. 10% or ₹50" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Minimum Order Amount</label>
              <input type="number" class="form-control" placeholder="₹" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Expiry Date</label>
              <input type="date" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Usage Limit</label>
              <input type="number" class="form-control" placeholder="Max uses" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-green">Save Coupon</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
