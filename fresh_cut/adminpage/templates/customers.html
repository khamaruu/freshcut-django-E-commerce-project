<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Customers</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body{
      background:#f5f7fa;
      font-family:"Segoe UI", system-ui;
    }
    .sidebar{
      width:260px;
      min-height:100vh;
      background:#1b5e20;
      color:#fff;
    }
    .sidebar a{
      color:#dfeede;
      text-decoration:none;
      display:block;
      padding:12px 20px;
      border-radius:8px;
      margin:6px 10px;
    }
    .sidebar a:hover,.sidebar a.active{
      background:#2e7d32;
      color:#fff;
    }
    .content{
      padding:30px;
    }
    .card{
      border:none;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }
    .customer-avatar{
      width:45px;
      height:45px;
      border-radius:50%;
      object-fit:cover;
    }
  </style>
</head>
<body>
 {% include 'sidebar.html' %}
  <!-- CONTENT -->
  <div class="flex-grow-1 content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">Customer Management</h3>
    </div>

    <!-- CUSTOMER TABLE -->
    <div class="card">
      <div class="card-body">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Orders</th>
              <th>Joined</th>
              <th>Status</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <img src="https://via.placeholder.com/100" class="customer-avatar" />
                  <span>Rahul Kumar</span>
                </div>
              </td>
              <td>rahul@gmail.com</td>
              <td>+91 98765 43210</td>
              <td>12</td>
              <td>10 Jan 2026</td>
              <td><span class="badge bg-success">Active</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-person-x"></i></button>
              </td>
            </tr>

            <tr>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <img src="https://via.placeholder.com/100" class="customer-avatar" />
                  <span>Afsal P</span>
                </div>
              </td>
              <td>afsal@gmail.com</td>
              <td>+91 95678 12345</td>
              <td>5</td>
              <td>05 Jan 2026</td>
              <td><span class="badge bg-warning text-dark">Blocked</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-outline-success"><i class="bi bi-person-check"></i></button>
              </td>
            </tr>

          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
