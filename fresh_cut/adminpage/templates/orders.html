<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Orders</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body{
      background:#f5f7fa;
      font-family:"Segoe UI", system-ui;
    }
    .sidebar{
      width:260px;
      min-height:100vh;
      background:#1b5e20;
      color:#fff;
    }
    .sidebar a{
      color:#dfeede;
      text-decoration:none;
      display:block;
      padding:12px 20px;
      border-radius:8px;
      margin:6px 10px;
    }
    .sidebar a:hover,.sidebar a.active{
      background:#2e7d32;
      color:#fff;
    }
    .content{
      padding:30px;
    }
    .card{
      border:none;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
    }
    .badge-status{
      padding:6px 10px;
      font-size:13px;
      border-radius:20px;
    }
  </style>
</head>
<body>
 {% include 'sidebar.html' %}
  <!-- CONTENT -->
  <div class="flex-grow-1 content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">Order Management</h3>
    </div>

    <!-- ORDERS TABLE -->
    <div class="card">
      <div class="card-body">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#ORD1021</td>
              <td>Rahul Kumar</td>
              <td>15 Jan 2026</td>
              <td>₹1,240</td>
              <td><span class="badge bg-success">Paid</span></td>
              <td><span class="badge bg-primary badge-status">Delivered</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
              </td>
            </tr>
            <tr>
              <td>#ORD1022</td>
              <td>Shameer Ali</td>
              <td>15 Jan 2026</td>
              <td>₹680</td>
              <td><span class="badge bg-warning text-dark">COD</span></td>
              <td><span class="badge bg-info badge-status">Processing</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
              </td>
            </tr>
            <tr>
              <td>#ORD1023</td>
              <td>Afsal P</td>
              <td>14 Jan 2026</td>
              <td>₹2,100</td>
              <td><span class="badge bg-success">Paid</span></td>
              <td><span class="badge bg-danger badge-status">Cancelled</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
