<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Cut | Category Detail</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root{
  --green:#1b5e20;
  --green2:#2e7d32;
  --bg:#f6f8f7;
}

body{
  background:var(--bg);
  font-family:"Segoe UI", system-ui;
}

.top-bar{
  background:linear-gradient(90deg,var(--green),var(--green2));
  color:#fff;
  padding:12px 20px;
}

.detail-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 28px rgba(0,0,0,.08);
  overflow:hidden;
}

.detail-img{
  height:260px;
  object-fit:cover;
}

.price{
  font-size:22px;
  font-weight:700;
  color:var(--green);
}

.badge-cut{
  background:#e8f5e9;
  color:var(--green);
}

.qty-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.qty-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:none;
  background:var(--green);
  color:#fff;
  font-size:18px;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar d-flex align-items-center">
  <i class="bi bi-arrow-left fs-4 me-3"></i>
  <h5 class="mb-0">Chicken Category</h5>
</div>

<div class="container my-4">

  <!-- CATEGORY DETAIL PAGE -->
  <div class="detail-card">
    <img src="https://via.placeholder.com/800x500" class="w-100 detail-img" alt="Chicken Curry Cut">

    <div class="p-4">
      <h4>Chicken Curry Cut</h4>
      <span class="badge badge-cut">Fresh • Halal</span>

      <p class="text-muted mt-3">
        Fresh farm chicken cleaned and hygienically cut into curry pieces.
        Perfect for traditional Kerala dishes.
      </p>

      <div class="price mb-3">₹320 / 1kg</div>

      <!-- QUANTITY -->
      <div class="qty-box mb-4">
        <strong>Quantity:</strong>
        <button class="qty-btn">−</button>
        <span>1</span>
        <button class="qty-btn">+</button>
      </div>

      <!-- ADD TO CART -->
      <button class="btn btn-success w-100 py-2">
        <i class="bi bi-cart-plus"></i> Add to Cart
      </button>
    </div>
  </div>

</div>

</body>
</html>
