<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fresh Cut | Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js (UI only) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#1b5e20;
  --primary-light:#2e7d32;
  --bg:#f1f8f4;
}

body{
  margin:0;
  background:var(--bg);
  font-family:"Segoe UI", system-ui;
}

.wrapper{
  display:flex;
  min-height:100vh;
}

/* Sidebar */
.sidebar{
  width:260px;
  background:linear-gradient(180deg,var(--primary),var(--primary-light));
  color:#fff;
  padding:25px;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:35px;
}

.menu a{
  display:block;
  padding:12px 16px;
  margin-bottom:8px;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  transition:.3s;
}

.menu a:hover,
.menu a.active{
  background:rgba(255,255,255,.18);
}

/* Logout */
.menu .logout{
  margin-top:40px;
  background:#e53935;
  text-align:center;
  font-weight:700;
}

.menu .logout:hover{
  background:#c62828;
}

/* Main */
.main{
  flex:1;
  padding:30px;
}

/* Topbar */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.admin-badge{
  background:#fff;
  padding:8px 18px;
  border-radius:20px;
  font-weight:600;
  color:var(--primary);
}

/* Cards */
.stat-card{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.stat-card p{
  color:#777;
  margin-bottom:6px;
}

.stat-card h2{
  font-weight:800;
  color:var(--primary);
}

/* Table */
.table-box{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

/* Chart */
.chart-box{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">FRESH CUT</div>

    <div class="menu">
      <a class="active">Dashboard</a>
      <a href="{% url 'product_list' %}">Products</a>
      <a href="{% url 'orders' %}">Orders</a>
      {% comment %} <a href="{% url 'Customers' %}">Customers</a> {% endcomment %}
      <a href="{% url 'category_list' %}">Categories</a>
      <a href="{% url 'coupons' %}">Coupons</a>
      <a href="{% url 'banners' %}">Banners</a>
      <a href="{% url 'product_create' %}">Add Product</a>
      <a href="{% url 'subcategory_list' %}">Sub Categories</a>

      <a href="{% url 'adminlogout' %}" class="logout">Logout</a>
    </div>
  </aside>
