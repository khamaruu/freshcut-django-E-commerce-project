<!DOCTYPE html>
<html>
<head>
<title>Checkout | FreshCut</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f7fa;">

<div class="container mt-5">
<div class="row">

<!-- LEFT SIDE -->
<div class="col-md-7">

<div class="card p-4 shadow-sm mb-4">
<h5>Select Delivery Address</h5>

<form method="POST" action="{% url 'cart' %}">
{% csrf_token %}

{% for address in addresses %}
<div class="form-check mb-2">
  <input class="form-check-input" type="radio" 
         name="address_id" 
         value="{{ address.id }}" required>
  <label class="form-check-label">
    {{ address.full_name }} |
    {{ address.phone }} <br>
    {{ address.house }}, {{ address.city }} - {{ address.pincode }}
  </label>
</div>
{% endfor %}

<hr>

<button type="submit" class="btn btn-success w-100 mt-3">
Proceed to Payment
</button>

</form>
</div>

<!-- ADD NEW ADDRESS -->
<div class="card p-4 shadow-sm">
<h5>Add New Address</h5>

<form method="POST" action="{% url 'add_address' %}">
{% csrf_token %}
{{ form.as_p }}
<button type="submit" class="btn btn-outline-success w-100">
Add Address
</button>
</form>

</div>

</div>

<!-- RIGHT SIDE -->
<div class="col-md-5">

<div class="card p-4 shadow-sm">
<h5>Order Summary</h5>

{% for item in cart_items %}
<p>{{ item.product.name }} ({{ item.quantity }}) - ₹{{ item.subtotal }}</p>
{% endfor %}

<hr>
<h6>Total: ₹{{ subtotal }}</h6>

</div>

</div>

</div>
</div>

</body>
</html>
