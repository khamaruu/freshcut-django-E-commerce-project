<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile | FreshCut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #e8f5e9, #f1f8f4);
        }

        .profile-card{
            max-width: 500px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .profile-img-preview{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #198754;
            margin-bottom:20px;
        }

        .btn-freshcut{
            background:#198754;
            color:white;
            border:none;
            border-radius:10px;
            padding:10px;
            font-weight:500;
        }

        .btn-freshcut:hover{
            background:#146c43;
        }
    </style>
</head>

<body>

<div class="profile-card text-center">

    <h4 class="fw-bold mb-3">Edit Profile</h4>

    <!-- IMAGE PREVIEW -->
    {% if user.profile.image %}
        <img id="previewImage" src="{{ user.profile.image.url }}" class="profile-img-preview">
    {% else %}
        <img id="previewImage" src="https://via.placeholder.com/120" class="profile-img-preview">
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3 text-start">
            <label class="form-label fw-semibold">Phone Number</label>
            {{ form.phone }}
        </div>

        <div class="mb-3 text-start">
            <label class="form-label fw-semibold">Change Profile Image</label>
            {{ form.image }}
        </div>

        <div class="d-grid">
            <button type="submit" class="btn-freshcut">Save Changes</button>
        </div>
    </form>

</div>

<!-- 🔥 JAVASCRIPT FOR LIVE PREVIEW -->
<script>
    const imageInput = document.querySelector("input[type='file']");
    const previewImage = document.getElementById("previewImage");

    imageInput.addEventListener("change", function(event) {
        const file = event.target.files[0];

        if (file) {
            const reader = new FileReader();

            reader.onload = function(e) {
                previewImage.src = e.target.result;
            }

            reader.readAsDataURL(file);
        }
    });
</script>

</body>
</html>
