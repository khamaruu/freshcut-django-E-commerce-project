{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Cut | Logout</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root{
  --green:#1b5e20;
  --green2:#2e7d32;
  --bg:#f6f8f7;
}

body{
  background:var(--bg);
  font-family:"Segoe UI", system-ui;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logout-card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  padding:30px;
  max-width:400px;
  width:100%;
  text-align:center;
}

.logout-card i{
  font-size:48px;
  color:var(--green);
}
</style>
</head>
<body>

<div class="logout-card">
  <i class="bi bi-box-arrow-right"></i>
  <h4 class="mt-3">Logout</h4>
  <p class="text-muted">Are you sure you want to logout from Fresh Cut?</p>

  <div class="d-flex justify-content-center gap-3 mt-4">
    <a href="login.html" class="btn btn-outline-secondary">Cancel</a>
    <a href="logout.html" class="btn btn-success">Yes, Logout</a>
  </div>
</div>

</body>
</html> {% endcomment %}
